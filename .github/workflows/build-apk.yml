name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Assets & Build Capacitor
        run: |
          mkdir www
          find . -maxdepth 1 ! -name '.' ! -name 'www' ! -name 'android' ! -name '.git' ! -name '.github' ! -name 'node_modules' -exec cp -r {} www/ \;
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "StoreScanner" "com.storescanner.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Gradle APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreScanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
