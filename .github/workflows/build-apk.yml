name: Build Android APK from HTML

on:
  push:
    branches:
      - main # أبدلها بـ master إذا كان هذا اسم الفرع لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Initialize Capacitor & Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          cp *.css *.js www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "President App" "com.president.app" --web-dir "www"
          npx cap add android

      - name: Inject Camera & GPS Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application'
          sed -i "s|<application|$PERMISSIONS|g" $MANIFEST

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: President-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
